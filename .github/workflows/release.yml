# Bir etiket (v1.0.0 gibi) gönderildiğinde macOS, Windows ve Linux paketlerini üretip GitHub Release'e ekler.
#   git tag v1.0.0 && git push origin v1.0.0
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      args: '--mac --arm64' }
          - { os: macos-13,      args: '--mac --x64' }
          - { os: windows-latest, args: '--win --x64' }
          - { os: ubuntu-latest,  args: '--linux --x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Test (sunucu)
        if: matrix.os == 'ubuntu-latest'
        run: cd server && npm ci && npm test
      - name: Paketle
        working-directory: host
        run: |
          npm ci
          npm run prepare-bundle
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            host/dist/*.dmg
            host/dist/*.zip
            host/dist/*.exe
            host/dist/*.AppImage
